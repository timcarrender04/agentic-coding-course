# Continue agent config — shared college vLLM endpoint (OpenAI-compatible)
# The endpoint runs vLLM on the shared server (2x NVIDIA RTX A6000, tensor-parallel).
# Use in IDE: Continue sidebar -> agent/config picker -> point at this file, or merge into ~/.continue/config.yaml
# Docs: https://docs.continue.dev/customize/model-providers/top-level/openai
#
# apiBase points at the shared endpoint (campus network / Tailscale). A single shared key
# is used for the whole cohort; on the open campus network apiKey may be omitted.

name: College Coder (vLLM)
version: 1.0.0
schema: v1

models:
  # Chat / edit / agent -> Llama 3.3 70B, tensor-parallel across both A6000s.
  # (Coming online; use the 8B only as a fallback if the 70B service is down.)
  - name: Llama 3.3 70B (chat/edit/agent)
    provider: openai
    model: meta-llama/Llama-3.3-70B-Instruct
    apiBase: http://gpu.college.local:8000/v1
    apiKey: sk-college-shared
    roles:
      - chat
      - edit
      - apply

  # Autocomplete only -> Llama 3.1 8B (fast, low-latency ghost text). Live now.
  - name: Llama 3.1 8B (autocomplete)
    provider: openai
    model: meta-llama/Llama-3.1-8B-Instruct
    apiBase: http://gpu.college.local:8000/v1
    apiKey: sk-college-shared
    roles:
      - autocomplete

context:
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
  - provider: file
  - provider: docs
