<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Temple College × ChiefOS — Tablecloth Mockup</title>
  <link rel="stylesheet" href="../../../public/branding/fonts/fonts.css" />
  <style>
    :root {
      --orange: #F5A83E;
      --orange-deep: #E87722;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1024px;
      height: 1024px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-family: "Barlow", "DejaVu Sans", Arial, sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 1024px;
      height: 1024px;
    }

    .scene .base {
      width: 100%;
      height: 100%;
      display: block;
    }

    .print-zone {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
    }

    .tc-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .tc-bars {
      width: 96px;
      height: 64px;
      display: block;
    }

    .tc-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.05;
    }

    .tc-sub {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--orange);
      line-height: 1.2;
    }

    .divider {
      width: 380px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange-deep), transparent);
    }

    .chief img {
      height: 72px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="scene" role="img" aria-label="Tablecloth mockup — Temple College Workforce Development and ChiefOS">
    <img class="base" src="../../../public/branding/tablecloth-mockup-base.png" alt="" role="presentation" />

    <div class="print-zone">
      <div class="tc-lockup">
        <svg class="tc-bars" viewBox="0 0 72 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="8" y="28" width="12" height="16" rx="1" fill="#F5A83E" />
          <rect x="30" y="16" width="12" height="28" rx="1" fill="#9aa3ad" />
          <rect x="52" y="4" width="12" height="40" rx="1" fill="#F5A83E" />
        </svg>
        <div class="tc-name">Temple College</div>
        <div class="tc-sub">Workforce Development</div>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="chief">
        <img src="../../../public/branding/chiefos-logo-transparent.svg" alt="ChiefOS" />
      </div>
    </div>
  </div>
</body>
</html>
